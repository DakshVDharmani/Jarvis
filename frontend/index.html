<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis</title>
</head>
<body style="background-color: black; color: #e6e6e6; font-family: Consolas, monospace; 
margin: 0; padding: 20px; height: 100vh; display: flex; justify-content: center; align-items: flex-end;
box-sizing: border-box;">
    <!--color is for text color,
    while background color is for the screen background
    padding helps not being stuck in the top left corner
    as margin is 0. flex is a 1D layout model that helps align, arrange, etc
    align items to flex-end pushes the content at the lower end of the screen  
    box-sizing border box fixed the vertical scroll of the body prev-->
    <div id = "terminal" style="line-height: 1.5; text-shadow: 0 0 3px currentColor;
    width: 80%; box-sizing: border-box; cursor: text; height: 25vh; margin-bottom: 8vh; padding: 20px; 
    border: 1px solid #333; border-radius: 8px; overflow-y: auto; background-color: #0a0a0a; position: relative;
    overflow-x: hidden; word-break: break-word; box-shadow: 0 0 20px rgba(0, 255, 136, 0.08); 
    scroll-behavior: smooth; display: block; flex-shrink: 0; font-size: 16px; letter-spacing: 0.3px; outline: none; 
    color: #00FF88; transition: box-shadow 0.2s ease;">
    <!--overflow-x hidden keeps long output to get a horizontal scrollbar
    word break stops long outputs to flow outside the container-->
        <span id = "output" style="white-space: pre-wrap; color: #00FF88; padding: 0; margin: 0;"></span>
        <!--span keeps the result inline, while div puts it to nextline-->
            <input id = "command" autofocus style="background-color: transparent; color: white; 
            border: none; outline: none; font-family: inherit; width: auto; font-size: 16px; 
            caret-color: white; padding: 4px 0; field-sizing: content; font-weight: 500; 
            letter-spacing: 0.3px; min-width: 10px; vertical-align: middle;
            display: inline-block; max-width: 100%; box-sizing: border-box;"/>
            <!--
            Inherit just inherits from the body
            vw is the width of the viewport window 
            vh is the height of the viewport window 
            box-sizing border box forces a border inside the allocated box width and height
            -->
    </div>

    <script>
        /*
        const is one of the ways to make variables in javascript, 
        after initializing with const, variable cannot be reassigned but modified 
        */

        const input = document.getElementById("command"); 
        const output = document.getElementById("output");
        const terminal = document.getElementById("terminal");
        
        const commandHistory = []; 
        let historyIndex = 0; 

        terminal.addEventListener("click", () =>{
            input.focus(); 
            //this way when clicked in the terminal, the cursor focuses on the input 
        })

        const SESSION_SECRET = "__SESSION_SECRET__"; 
        
        const connection = new WebSocket(`ws://127.0.0.1:3000`); 
        //hooks the frontend to the websocket server 

        connection.onopen = () => {
            console.log("Connected to Jarvis' Server"); 
        }; 

        input.addEventListener("keydown", (event) =>{
            if(event.key == "Enter"){
                const command = input.value; 
                //this stores whatever was typed before ENTER into command variable 
                commandHistory.push(command); 
                historyIndex = commandHistory.length; 
                //saves the history of commands in an array of commands 

                output.textContent += command + "\n"; 

                connection.send(JSON.stringify({
                    message : command, 
                    secret : SESSION_SECRET
                })); 

                input.value = ""; 
                //thus the box becomes empty for the next command \
            }

            else if(event.key == "ArrowUp"){
                if(historyIndex>0){
                    historyIndex--; 
                    input.value = commandHistory[historyIndex]; 
                }
            }
            //adds scroll through previous commands, without deleting anything from the prev commands 

            else if(event.key == "ArrowDown"){
                if(historyIndex<commandHistory.length-1){
                    historyIndex++; 
                    input.value = commandHistory[historyIndex]; 
                }

                else{
                    historyIndex = commandHistory.length; 
                    input.value = ""; 
                }
            }

        }); 
        //detects ENTER has been pressed to take input 

        connection.onmessage = (event) => {
            const data = JSON.parse(event.data); 
            //convert JSON into js object given by the shell through websocket 

            if(data.message.includes("\x1b[2J\x1b[H")){
                output.textContent = ""; 
                data.message = data.message.replace("\x1b[2J\x1b[H", ""); 
                //removes only the input characters, leaves Jarvis:C:\Jarvis$ alone
            }

            output.textContent += data.message; 
            terminal.scrollTop = terminal.scrollHeight; 
            //scrolls to the bottom whenever the output comes 
        }; 
        //displays the output of the input 
    </script>
</body>
</html>
